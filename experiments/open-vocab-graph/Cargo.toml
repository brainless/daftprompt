[package]
name = "open-vocab-graph"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
glob = "0.3"
# Same pinned revision as crates/daftprompt-indexer so the workspace shares
# one llm-sdk checkout.
llm-sdk = { git = "https://github.com/brainless/llm-sdk", rev = "9d44871870ef177d12d704ad7c6841709e4f0d0a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
