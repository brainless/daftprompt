[package]
name = "daftprompt-core"
description = "Shared parsing, validation, agent, and graph-construction library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
daftprompt-types.workspace = true
# The provider factory in `llm` builds OpenAI-compatible clients, which needs
# Rig's reqwest transport (rustls TLS).
rig = { workspace = true, features = ["reqwest", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ignore.workspace = true
globset.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
directories.workspace = true
pulldown-cmark.workspace = true
# Original v3 evaluation schema; normal core builds use the shared types.
schemars = { workspace = true, optional = true }
# Only the live evaluation binary loads `.env`; see the `live-eval` feature.
dotenvy = { workspace = true, optional = true }
# The timer is used for per-attempt timeouts, and `spawn_blocking` keeps the git
# subprocess calls off the async workers. The library stays runtime-agnostic
# otherwise.
tokio = { workspace = true, features = ["time", "rt"] }

[dev-dependencies]
tempfile.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[[bin]]
name = "evaluate-scribe"
path = "src/bin/evaluate_scribe.rs"
# The evaluation binary is opt-in: ordinary builds and tests do not compile a
# provider transport or require credentials.
required-features = ["live-eval"]

[[bin]]
name = "evaluate-explainer"
path = "src/bin/evaluate_explainer.rs"
required-features = ["live-eval"]

[features]
default = []
# Enables the live Scribe evaluation binary: the provider transport and `.env`
# loading (requiring the selected provider's API key at run time). The Tokio runtime features come
# from the workspace dependency.
live-eval = ["rig/reqwest", "rig/rustls", "dep:dotenvy", "dep:schemars"]

[lints.cargo]
# The architecture fixes this dependency: Rig is the agent framework used by
# Scribe in epic 001, task 2. Keep the direction in place from the start.
unused_dependencies = "allow"
