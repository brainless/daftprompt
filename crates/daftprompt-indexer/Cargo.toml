[package]
name = "daftprompt-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
model2vec-rs = "0.2.1"
sqlite-vec = "0.0.1-alpha.33"
rusqlite = { version = "0.31", features = ["bundled"] }
zerocopy = "0.7"
anyhow = "1"
dirs = "5"
serde_json = "1"
log = "0.4"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
# Epic 009 Task 2: TypeScript grammar for `.ts` files. Published 0.23.x
# declares tree-sitter as a dev-dependency only (tested against ^0.24) —
# runtime integration goes through `tree-sitter-language = 0.1`, which is
# API-compatible with the workspace's `tree-sitter = 0.25`. The local
# checkout at `~/Projects/tree-sitter-typescript` is also v0.23.2 but we
# use the published crate here, not a path dependency.
tree-sitter-typescript = "0.23"
# Epic 010 Task 1: JavaScript grammar for `.js` and `.jsx` files. Pinned
# to 0.25.x to match the workspace's `tree-sitter = 0.25` runtime — the
# 0.25 grammar uses the same `tree-sitter-language = 0.1` `LanguageFn`
# shim as the TypeScript crate above, so the grammar can be coerced via
# `.into()` exactly like TypeScript. The JavaScript grammar also accepts
# JSX syntax natively (the scanner handles `JSX_TEXT` via valid_symbols),
# so `.js` and `.jsx` share one `LANGUAGE` constant but keep two
# dispatch variants in the [`CodeLanguage`] enum so metadata distinguishes
# them. Local checkout at `~/Projects/tree-sitter-javascript` matches
# this version.
tree-sitter-javascript = "0.25"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = "0.4"
gix = { path = "../../../gitoxide/gix", default-features = false, features = ["basic", "sha1"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
