[package]
name = "daftprompt-api"
description = "Stateless HTTP service for daftprompt parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
daftprompt-core.workspace = true
daftprompt-types.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
http-body-util.workspace = true
# The provider factory lives in `daftprompt_core::llm`; the API only needs Rig's
# types through core.
rig.workspace = true

[dev-dependencies]
tower.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints.cargo]
# Wired in now so the dependency direction is fixed; the parse route uses the
# shared library directly.
unused_dependencies = "allow"
