[package]
name = "daftprompt-api"
description = "Stateless HTTP service for daftprompt parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
daftprompt-core.workspace = true
daftprompt-types.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
serde_json.workspace = true
dotenvy.workspace = true
http-body-util.workspace = true
# The API process builds the provider client from environment credentials. Rig's
# reqwest/rustls transport is enabled here only; the core manifest stays free of
# provider transports.
rig = { workspace = true, features = ["reqwest", "rustls"] }

[dev-dependencies]
tower.workspace = true

[lints.cargo]
# Wired in now so the dependency direction is fixed; the parse route uses the
# shared library directly.
unused_dependencies = "allow"
